services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://thinkspace:password123@db:5432/thinkspacedb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - thinkspace_net
    volumes:
      - ./src/app:/app/src/app

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: thinkspace
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: thinkspacedb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkspace -d thinkspacedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thinkspace_net

volumes:
  pgdata:

networks:
  thinkspace_net:
    driver: bridge
